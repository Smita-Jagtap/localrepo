[pytest]
addopts = --html=reports/report.html --self-contained-html --browser chromium
testpaths = tests
log_cli = true
log_cli_level = INFO
log_file = logs/test_logs.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

markers =
    sanity: marks tests as sanity tests (deselect with '-m "not sanity"')
    smoke: marks tests as smoke tests
